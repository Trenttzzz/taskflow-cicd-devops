name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  # ── CI: Vet, Test, and Coverage ─────────────────────────────────────────────
  ci:
    name: CI - Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: Unit test + race detector
        run: go test -race ./... -timeout 30s

      - name: Build binary (compile check)
        run: |
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-w -s" \
            -o /tmp/taskflow-api \
            ./cmd/server

      - name: Integration test
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: go test -tags=integration -race ./... -timeout 60s

      - name: Coverage check
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: coverage.out

  # ── Security Scan ───────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run dependency vulnerability scan
        id: govulncheck
        continue-on-error: true
        run: govulncheck -json ./... > govulncheck-report.json

      - name: Run static application security scan
        id: gosec
        continue-on-error: true
        run: gosec -severity high -confidence medium -fmt json -out gosec-report.json ./...

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck-report.json

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json

      - name: Fail on security findings
        if: steps.govulncheck.outcome == 'failure' || steps.gosec.outcome == 'failure'
        run: |
          echo "Security scan found blocking findings"
          exit 1

  # ── CD: Docker Build & Push ────────────────────────────────────────────────
  cd:
    name: CD - Docker Build & Push
    runs-on: ubuntu-latest

    needs: [ci, security]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
      sha_short: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}

      - name: Output image tag
        run: |
          echo "Image pushed:"
          echo "${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}"

  # ── Smoke Test ─────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    needs: [cd]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull \
            ${{ env.REGISTRY }}/${{ needs.cd.outputs.image_name }}:sha-${{ needs.cd.outputs.sha_short }}

      - name: Run container
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: |
          docker run -d \
            --name taskflow-api \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=8080 \
            ${{ env.REGISTRY }}/${{ needs.cd.outputs.image_name }}:sha-${{ needs.cd.outputs.sha_short }}

      - name: Wait server ready
        run: |
          echo "Waiting for server..."
          sleep 5

      - name: Smoke test /health
        run: |
          curl -f http://localhost:8080/health || exit 1

      - name: Smoke test /api/v1/stats
        run: |
          curl -f http://localhost:8080/api/v1/stats || exit 1

      - name: Smoke test success
        run: echo "✅ Smoke test berhasil"

      - name: Cleanup container
        if: always()
        run: |
          docker stop taskflow-api || true
          docker rm taskflow-api || true

  # ── Tag Stable ─────────────────────────────────────────────────────────────
  tag-stable:
    name: Tag Stable
    runs-on: ubuntu-latest

    needs: [smoke-test]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Tag stable image
        run: |
          docker pull \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}

          docker tag \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }} \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:stable

          docker push \
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:stable

  # ── Telegram Notification ──────────────────────────────────────────────────
  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest

    needs: [ci, security, cd, smoke-test, tag-stable]

    if: always()

    steps:
      - name: Notify Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: |
          TIME=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M:%S WIB')

          curl -s -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_TO }}",
              "parse_mode": "Markdown",
              "text": "✅ *TaskFlow Pipeline SUCCESS*\n\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Waktu:* '"$TIME"'\n\n*URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage

      - name: Notify Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          TIME=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M:%S WIB')

          curl -s -X POST \
            -H 'Content-Type: application/json' \
            -d '{
              "chat_id": "${{ secrets.TELEGRAM_TO }}",
              "parse_mode": "Markdown",
              "text": "❌ *TaskFlow Pipeline FAILED*\n\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Waktu:* '"$TIME"'\n\n*URL:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage
