name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI - Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify Go version
        run: go version

      - name: go vet
        run: go vet ./...

      - name: Unit test with race detector
        run: go test -race ./... -timeout 30s

      - name: Integration test
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: go test -tags=integration -race ./... -timeout 60s

      - name: Coverage check
        run: |
          mkdir -p ci-logs
          set -o pipefail
          {
            go test ./... -coverprofile=coverage.out -covermode=atomic
            go tool cover -func=coverage.out
            COVERAGE=$(go tool cover -func=coverage.out | awk '/total:/ {gsub("%","",$3); print $3}')
            echo "Total coverage: $COVERAGE%"
            awk -v coverage="$COVERAGE" 'BEGIN { exit !(coverage >= 101.0) }' || {
              echo "Coverage $COVERAGE% is below 101%"
              exit 1
            }
            echo "Coverage $COVERAGE% meets requirement"
          } 2>&1 | tee "ci-logs/coverage-check-go-${{ matrix.go-version }}.log"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-go-${{ matrix.go-version }}
          path: |
            coverage.out
            ci-logs/
          if-no-files-found: ignore

      - name: Build binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/taskflow-api ./cmd/server

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-api-binary-go-${{ matrix.go-version }}
          path: bin/taskflow-api

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run dependency vulnerability scan
        id: govulncheck
        continue-on-error: true
        run: govulncheck -json ./... > govulncheck-report.json

      - name: Run static application security scan
        id: gosec
        continue-on-error: true
        run: gosec -severity high -confidence medium -fmt json -out gosec-report.json ./...

      - name: Upload govulncheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: govulncheck-report.json

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json

      - name: Fail on security findings
        if: steps.govulncheck.outcome == 'failure' || steps.gosec.outcome == 'failure'
        run: |
          echo "Security scan found blocking findings. Check uploaded reports."
          exit 1

  cd:
    name: CD - Docker Build, Push, and Smoke Test
    runs-on: ubuntu-latest
    needs: [ci, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow_secret
          POSTGRES_DB: taskflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull and run image for smoke test
        env:
          DATABASE_URL: postgres://taskflow:taskflow_secret@localhost:5432/taskflow?sslmode=disable
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}"
          docker pull "$IMAGE"
          docker run -d \
            --name taskflow-api \
            --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e PORT=8080 \
            "$IMAGE"
          sleep 2
          docker ps -a
          docker logs taskflow-api 2>&1 | head -50 || true

      - name: Wait for startup
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "Server is ready after ${i} seconds"
              exit 0
            fi
            if ! docker ps | grep -q taskflow-api; then
              echo "Container stopped before readiness."
              docker logs taskflow-api 2>&1 | tail -30 || true
              exit 1
            fi
            docker logs taskflow-api --tail 3 2>&1 || true
            sleep 1
          done
          echo "Server failed to start within 30 seconds."
          docker logs taskflow-api 2>&1 || true
          docker ps -a
          exit 1

      - name: Smoke test /health
        run: |
          curl -sf http://localhost:8080/health
          echo "/health OK"

      - name: Smoke test /api/v1/stats
        run: |
          curl -sf http://localhost:8080/api/v1/stats
          echo "/api/v1/stats OK"

      - name: Cleanup container
        if: always()
        run: |
          docker logs taskflow-api 2>&1 || true
          docker stop taskflow-api 2>&1 || true
          docker rm taskflow-api 2>&1 || true

  tag-stable:
    name: Tag Stable
    runs-on: ubuntu-latest
    needs: [cd]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.cd.result == 'success'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Tag and push stable
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:sha-${{ steps.vars.outputs.sha_short }}"
          STABLE_IMAGE="${{ env.REGISTRY }}/${{ steps.vars.outputs.image_name }}:stable"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$STABLE_IMAGE"
          docker push "$STABLE_IMAGE"
          echo "Tagged sha-${{ steps.vars.outputs.sha_short }} as stable"

  failure-intelligence:
    name: AI Failure Intelligence
    runs-on: ubuntu-latest
    needs: [ci, security, cd, tag-stable]
    if: always()
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check pipeline status
        id: failure-status
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CD_RESULT: ${{ needs.cd.result }}
          TAG_STABLE_RESULT: ${{ needs.tag-stable.result }}
        run: python3 scripts/failure_status.py

      - name: Collect failed job logs
        if: steps.failure-status.outputs.should_analyze == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 scripts/collect_failure_logs.py

      - name: Download failure context artifacts
        if: steps.failure-status.outputs.should_analyze == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-report-go-*
          path: failure-context
          merge-multiple: true

      - name: Append failure context artifacts
        if: steps.failure-status.outputs.should_analyze == 'true'
        run: |
          if find failure-context -type f -name '*.log' | grep -q .; then
            {
              echo
              echo "===== Failure context artifacts ====="
              find failure-context -type f -name '*.log' -print -exec sed -n '1,220p' {} \;
            } >> ai-reports/current-failure.log
          fi

      - name: Clean failed job logs
        if: steps.failure-status.outputs.should_analyze == 'true'
        run: python3 scripts/clean_failure_log.py

      - name: Build embedding index
        if: steps.failure-status.outputs.should_analyze == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/build_embedding_index.py

      - name: Retrieve similar failures
        if: steps.failure-status.outputs.should_analyze == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/retrieve_similar_failures.py --query ai-reports/current-failure.cleaned.log --top-k 3

      - name: Generate failure report
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/generate_failure_report.py

      - name: Upload AI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-reports
          path: ai-reports/

  notify:
    name: Telegram Notification
    runs-on: ubuntu-latest
    needs: [ci, security, cd, tag-stable, failure-intelligence]
    if: always()

    steps:
      - name: Download AI report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ai-reports
          path: ai-reports

      - name: Notify Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Pembaruan kode' }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_TO" ]; then
            echo "Telegram secrets are not configured."
            exit 0
          fi
          export TIME=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M:%S WIB')
          python3 - <<'PY' > payload.json
          import json
          import os
          commit_message = os.environ["RAW_COMMIT_MSG"].splitlines()[0][:200]
          text = (
              "TaskFlow Pipeline SUCCESS\n\n"
              f"Waktu: {os.environ['TIME']}\n"
              f"Branch: {os.environ['GITHUB_REF_NAME']}\n"
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              f"Pesan: {commit_message}\n\n"
              f"URL: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          print(json.dumps({"chat_id": os.environ["TELEGRAM_TO"], "text": text}))
          PY
          curl -s -X POST -H 'Content-Type: application/json' \
            -d @payload.json \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"

      - name: Notify Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        continue-on-error: true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          RAW_COMMIT_MSG: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Pembaruan kode' }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ] || [ -z "$TELEGRAM_TO" ]; then
            echo "Telegram secrets are not configured."
            exit 0
          fi
          export TIME=$(TZ='Asia/Jakarta' date +'%Y-%m-%d %H:%M:%S WIB')
          python3 - <<'PY' > payload.json
          import json
          import os
          from pathlib import Path

          report_path = Path("ai-reports/failure-intelligence-report.md")
          if report_path.exists():
              report = report_path.read_text(encoding="utf-8", errors="replace")
              summary = " ".join(line.strip() for line in report.splitlines() if line.strip() and not line.startswith("#"))
              summary = summary[:700] or "AI failure report tersedia sebagai artifact."
          else:
              summary = "Pipeline failed. AI failure report unavailable. Check workflow logs."

          commit_message = os.environ["RAW_COMMIT_MSG"].splitlines()[0][:200]
          text = (
              "TaskFlow Pipeline FAILED\n\n"
              f"Waktu: {os.environ['TIME']}\n"
              f"Branch: {os.environ['GITHUB_REF_NAME']}\n"
              f"Commit: {os.environ['GITHUB_SHA']}\n"
              f"Pesan: {commit_message}\n\n"
              f"AI summary: {summary}\n\n"
              f"URL: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          print(json.dumps({"chat_id": os.environ["TELEGRAM_TO"], "text": text}))
          PY
          curl -s -X POST -H 'Content-Type: application/json' \
            -d @payload.json \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage"
